<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookieLab</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="contenedor">
        <header>
            <h1>🍪 CookieLab</h1>
            <p class="subtitulo">Una web que te recuerda, paso a paso</p>
        </header>

        <!-- Fase 1 y 2: saludo -->
        <section class="tarjeta">
            <p id="saludo"></p>
            <!-- Fase 4: contador de visitas -->
            <p id="visitas"></p>
            <!-- Extra: última visita -->
            <p id="ultimaVisita"></p>
        </section>

        <!-- Fase 3: preferencias -->
        <section class="tarjeta">
            <h2>Preferencias</h2>
            <div class="fila">
                <label for="tema">Tema</label>
                <select id="tema">
                    <option value="oscuro">Oscuro</option>
                    <option value="claro">Claro</option>
                </select>
            </div>
            <div class="fila">
                <label for="idioma">Idioma</label>
                <select id="idioma">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </div>
        </section>

        <!-- Fase 5: panel de control -->
        <section class="tarjeta">
            <h2>Panel de control</h2>
            <div class="botones">
                <button id="btnCambiarNombre">Cambiar mi nombre</button>
                <button id="btnOlvidarme" class="peligro">Olvidarme</button>
            </div>
        </section>

        <!-- Extra: caducidad corta -->
        <section class="tarjeta">
            <h2>Caducidad corta</h2>
            <p>Crea una cookie que dura solo 1 minuto y mira cómo desaparece sola.</p>
            <button id="btnCookieCorta">Crear cookie de 1 minuto</button>
            <p id="estadoCookieCorta"></p>
        </section>

        <!-- Visor de cookies (lo que devuelve document.cookie) -->
        <section class="tarjeta">
            <h2>document.cookie</h2>
            <pre id="visorCookies"></pre>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
